<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gyuhyeong Kim</title>
  <meta name="description" content="Gyuhyeong (Giana) Kim, Information Systems at HKUST. An archive of projects along the route Jeju, Gland, Qingdao, Paris, Hong Kong and Seoul: AI agents and automation for finance and operations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <script>
    try { var s = localStorage.getItem("lang"); if (s === "ko" || s === "en") document.documentElement.lang = s; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <button class="name" id="home" type="button"><span class="nm"></span></button>
    <ol class="dots" id="dots" aria-label="Route"></ol>
    <div class="tb">
      <button class="chip" id="to-contact" type="button"></button>
      <button class="chip" id="lang-toggle" type="button"></button>
    </div>
  </header>

  <main class="track" id="track" aria-live="polite">
    <svg class="route" id="route" aria-hidden="true"></svg>
  </main>

  <button class="edge prev" id="prev" type="button" aria-label="Previous stop"><span></span></button>
  <button class="edge next" id="next" type="button"><span id="next-label"></span></button>

  <div class="doc" id="doc" hidden role="dialog" aria-modal="true" aria-labelledby="doc-title"></div>

  <script src="data.js"></script>
  <script>
  {
    const root = document.documentElement;
    const R = window.ROUTE, SK = window.SKILLS;
    const L = () => (root.lang === "ko" ? "ko" : "en");
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const tx = o => (o == null ? "" : esc(typeof o === "string" ? o : o[L()]));
    const UI = {
      name: { en: "Gyuhyeong Kim", ko: "김규형" },
      contact: { en: "Contact", ko: "연락" },
      lang: { en: "한국어", ko: "English" },
      stop: { en: "Stop", ko: "정거장" },
      open: { en: "Open file →", ko: "파일 열기 →" },
      next: { en: "Next", ko: "다음" },
      prevf: { en: "← Previous file", ko: "← 이전 파일" },
      nextf: { en: "Next file →", ko: "다음 파일 →" },
      close: { en: "Close ✕", ko: "닫기 ✕" },
      period: { en: "Period", ko: "기간" },
      where: { en: "Filed under", ko: "보관 위치" },
      ctx: { en: "Context", ko: "맥락" },
      end: { en: "End of the line", ko: "종착역" },
      lede: { en: "I build AI agents and automation that take repetitive work off people's hands, mostly in finance and operations, and I make sure the numbers can be checked.", ko: "반복되는 일을 AI 에이전트와 자동화로 바꾸는 일을 합니다. 주로 금융과 운영 분야이고, 숫자는 언제나 확인할 수 있게 만듭니다." },
      facts: { en: "BBA Information Systems, HKUST · graduating Dec 2027<br>Korean · English · French · Chinese (basic)", ko: "HKUST 경영학부 정보시스템 전공 · 2027년 12월 졸업 예정<br>한국어 · 영어 · 프랑스어 · 중국어(기초)" },
      howto: { en: "This is an archive along my route. Move to the right edge, press → or swipe to travel. Click a folder tab to open it.", ko: "제가 지나온 노선을 따라 정리한 아카이브입니다. 오른쪽 끝에 마우스를 대거나 → 키, 스와이프로 이동하고, 폴더 탭을 누르면 열립니다." },
      endIntro: { en: "Open to roles in AI automation, product and data. Email is the fastest way to reach me.", ko: "AI 자동화, 기획, 데이터 분야의 기회에 열려 있습니다. 이메일이 가장 빠릅니다." }
    };
    const u = k => esc(UI[k][L()]);
    const lanes = [
      { k: "pa", en: "Paris", ko: "파리" }, { k: "ch", en: "Switzerland", ko: "스위스" },
      { k: "qd", en: "Qingdao", ko: "칭다오" }, { k: "kr", en: "Korea", ko: "한국" }, { k: "hk", en: "Hong Kong", ko: "홍콩" }
    ];
    const PAL = [["#6d1f55", "#fff"], ["#e2692b", "#fff"], ["#2f7d6d", "#fff"], ["#cf3a2f", "#fff"], ["#55267a", "#fff"], ["#3157d6", "#fff"], ["#bf5b8f", "#fff"], ["#f1d94a", "#1b1b1b"], ["#1f6f8b", "#fff"], ["#2b2b2b", "#fff"]];
    const FEAT = [["aurora", { en: "Top 10% of 2,916", ko: "2,916명 중 상위 10%" }], ["alphaprobe", { en: "30 → 3 min, Best Team", ko: "30분 → 3분, 최우수팀" }], ["pipeline", { en: "Ran in production", ko: "프로덕션 운영" }]];

    // flat list of files with their stop and colour
    const FILES = [];
    R.forEach((s, si) => s.files.forEach((f, fi) => FILES.push({ f, s, si, col: fi % 3, pal: PAL[FILES.length % PAL.length] })));
    const byId = id => FILES.find(x => x.f.id === id);

    const track = document.getElementById("track");
    const svg = document.getElementById("route");
    const N = R.length + 1; // + end panel
    let cur = 0, tgt = 0;

    const tabShape = '<svg viewBox="0 0 300 48" preserveAspectRatio="none" aria-hidden="true"><path d="M0 48 C20 48 18 0 44 0 H256 C282 0 280 48 300 48 Z"/></svg>';

    function folderHTML(x, open) {
      const f = x.f;
      return `<div class="folder${open ? " open" : ""}" id="fd-${f.id}" style="--fb:${x.pal[0]};--fi:${x.pal[1]};--col:${x.col}">
        <button class="tab" type="button" aria-expanded="${open ? "true" : "false"}" aria-controls="fb-${f.id}">${tabShape}<span>${tx(f.tab || f.title)}</span></button>
        <div class="fbody" id="fb-${f.id}"><div><div class="finner">
          <span class="no">${esc(f.no)}</span><p class="sm">${tx(f.summary)}</p><span class="dt">${tx(f.date)}</span>
          <button class="op" type="button" data-open="${f.id}">${u("open")}</button>
        </div></div></div>
      </div>`;
    }

    function panelHTML(s, i) {
      const files = FILES.filter(x => x.si === i).map((x, j) => folderHTML(x, j === 0)).join("");
      const stopHead = `<span class="k">${u("stop")} ${i + 1} · ${tx(s.when)}</span>
        <h2>${tx(s.city)}</h2><p class="place">${tx(s.place)}</p><p class="intro">${tx(s.intro)}</p>`;
      const head = i === 0
        ? `<div class="head hello"><h1>${u("name")}</h1><p class="lede">${u("lede")}</p><p class="facts">${UI.facts[L()]}<br><a href="mailto:gyuhyeongkim412@gmail.com">gyuhyeongkim412@gmail.com</a> · <a href="https://github.com/Giana0412">GitHub</a> · <a href="https://www.linkedin.com/in/gyuhyeong-kim">LinkedIn</a></p>
            <div class="feat">${FEAT.map(([id, note]) => `<button type="button" data-open="${id}"><b>${tx(byId(id).f.title)}</b><span>${esc(note[L()])}</span></button>`).join("")}</div>
            <p class="howto">${u("howto")}</p></div>`
        : `<div class="head">${stopHead}</div>`;
      const lead = i === 0 ? `<div class="head stophead">${stopHead}</div>` : "";
      return `<section class="panel" id="${s.id}" style="--c:var(--${s.lane})" aria-label="${tx(s.city)}">${head}<div class="stack">${lead}${files}</div></section>`;
    }

    function endHTML() {
      return `<section class="panel endp" id="contact" style="--c:var(--mute)" aria-label="${u("contact")}">
        <div class="head"><span class="k">${u("end")}</span><h2>${u("contact")}</h2><p class="intro">${u("endIntro")}</p>
          <p class="contact"><a href="mailto:gyuhyeongkim412@gmail.com">gyuhyeongkim412@gmail.com</a><br><a href="https://github.com/Giana0412">github.com/Giana0412</a><br><a href="https://www.linkedin.com/in/gyuhyeong-kim">linkedin.com/in/gyuhyeong-kim</a></p></div>
        <dl class="skills">${SK.map(([a, b]) => `<div><dt>${tx(a)}</dt><dd>${tx(b)}</dd></div>`).join("")}</dl>
      </section>`;
    }

    function render() {
      track.querySelectorAll(".panel").forEach(p => p.remove());
      track.insertAdjacentHTML("beforeend", R.map(panelHTML).join("") + endHTML());
      document.querySelector(".nm").textContent = UI.name[L()];
      document.getElementById("to-contact").textContent = UI.contact[L()];
      const lt = document.getElementById("lang-toggle");
      lt.textContent = UI.lang[L()];
      lt.setAttribute("aria-label", L() === "ko" ? "View in English" : "한국어로 보기");
      document.title = UI.name[L()];
      document.getElementById("dots").innerHTML =
        R.map((s, i) => `<li class="${s.next ? "dash" : ""}"><button type="button" data-go="${i}" style="--c:var(--${s.lane})" aria-label="${tx(s.city)}"></button></li>`).join("") +
        `<li><button type="button" class="sq" data-go="${N - 1}" style="--c:var(--mute)" aria-label="${u("contact")}"></button></li>`;
      drawRoute();
      mark();
    }

    function drawRoute() {
      const W = track.clientWidth, Hb = W <= 800 ? 130 : 150;
      const gx = Math.max(W * 0.04, 16);
      const ly = k => 26 + lanes.findIndex(l => l.k === k) * (Hb - 46) / (lanes.length - 1);
      const sx = i => i * W + gx + 9;
      let h = "";
      for (let p = 0; p < N; p++) lanes.forEach(l => {
        h += `<line class="lane" x1="${p * W}" x2="${(p + 1) * W}" y1="${ly(l.k)}" y2="${ly(l.k)}"/>`;
      });
      if (W > 800) for (let p = 0; p < N; p++) lanes.forEach(l => {
        h += `<text class="lanelab" x="${(p + 1) * W - gx - 64}" y="${ly(l.k) - 5}" text-anchor="end">${esc(l[L()])}</text>`;
      });
      R.forEach((s, i) => {
        const a = { x: sx(i), y: ly(s.lane) };
        const b = i < R.length - 1 ? { x: sx(i + 1), y: ly(R[i + 1].lane) } : { x: sx(i) + W * 0.7, y: a.y };
        const bend = a.x + W * 0.58, bend2 = a.x + W * 0.72;
        const d = `M${a.x} ${a.y} H${bend} L${bend2} ${b.y} H${b.x}`;
        const dashed = i === R.length - 1 || R[i + 1].next;
        h += `<path class="${dashed ? "dash" : "seg"}" d="${d}" stroke="var(--${s.lane})"/>`;
      });
      R.forEach((s, i) => {
        const x = sx(i), y = ly(s.lane);
        h += `<circle cx="${x}" cy="${y}" r="9" stroke="var(--${s.lane})"/>`;
        h += `<text x="${x + 18}" y="${y - 10}">${esc(s.city[L()].toUpperCase())} · ${esc(s.when[L()])}</text>`;
      });
      svg.setAttribute("width", N * W);
      svg.setAttribute("height", Hb);
      svg.setAttribute("viewBox", `0 0 ${N * W} ${Hb}`);
      svg.innerHTML = h;
    }

    // moving between stops
    const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
    function go(i, instant) {
      tgt = Math.max(0, Math.min(N - 1, i));
      track.scrollTo({ left: tgt * track.clientWidth, behavior: instant || reduce() ? "auto" : "smooth" });
      mark(tgt);
    }
    function mark(i = cur) {
      document.querySelectorAll("#dots button").forEach(b => b.setAttribute("aria-current", +b.dataset.go === i ? "true" : "false"));
      const nx = document.getElementById("next"), pv = document.getElementById("prev");
      nx.hidden = i >= N - 1; pv.hidden = i <= 0;
      const nextName = i + 1 < R.length ? R[i + 1].city[L()] : UI.contact[L()];
      document.getElementById("next-label").textContent = `${UI.next[L()]} · ${nextName} →`;
      nx.setAttribute("aria-label", `${UI.next[L()]}: ${nextName}`);
    }
    let settle;
    track.addEventListener("scroll", () => {
      const i = Math.round(track.scrollLeft / track.clientWidth);
      if (i !== cur) { cur = i; mark(i); }
      clearTimeout(settle);
      settle = setTimeout(() => {
        tgt = cur;
        const id = cur < R.length ? R[cur].id : "contact";
        if (document.getElementById("doc").hidden) history.replaceState(null, "", "#" + id);
      }, 140);
    }, { passive: true });

    let hover;
    const nextBtn = document.getElementById("next");
    nextBtn.addEventListener("mouseenter", () => {
      const step = () => { if (tgt < N - 1) { go(tgt + 1); hover = setTimeout(step, 1400); } };
      hover = setTimeout(step, 260);
    });
    nextBtn.addEventListener("mouseleave", () => clearTimeout(hover));
    nextBtn.addEventListener("click", () => { clearTimeout(hover); go(tgt + 1); });
    document.getElementById("prev").addEventListener("click", () => go(tgt - 1));
    document.getElementById("home").addEventListener("click", () => go(0));
    document.getElementById("to-contact").addEventListener("click", () => go(N - 1));

    // folders, dots, featured files
    document.addEventListener("click", e => {
      const g = e.target.closest("[data-go]");
      if (g) return go(+g.dataset.go);
      const o = e.target.closest("[data-open]");
      if (o) return openDoc(o.dataset.open);
      const tab = e.target.closest(".tab");
      if (tab) {
        const fd = tab.parentElement, open = !fd.classList.contains("open");
        fd.classList.toggle("open", open);
        tab.setAttribute("aria-expanded", open);
      }
    });

    // document view
    const doc = document.getElementById("doc");
    let lastFocus = null, openId = null;
    function openDoc(id) {
      const x = byId(id);
      if (!x) return;
      const f = x.f, k = FILES.indexOf(x);
      openId = id;
      if (doc.hidden) lastFocus = document.activeElement;
      const secs = (f.sections || []).map(s => `<div class="sec"><h3>${tx(s.h)}</h3>${s.p ? `<p>${tx(s.p)}</p>` : ""}${s.li ? `<ul>${s.li.map(l => `<li>${tx(l)}</li>`).join("")}</ul>` : ""}</div>`).join("");
      const prev = FILES[k - 1], next = FILES[k + 1];
      doc.innerHTML = `<div class="sheet" style="--fb:${x.pal[0]};--fi:${x.pal[1]}">
        <div class="holes" aria-hidden="true"><i></i><i></i><i></i></div>
        <article class="paper">
          <span class="stamp">File № ${esc(f.no)}</span>
          <h2 id="doc-title">${tx(f.title)}</h2>
          <p class="lead">${tx(f.summary)}</p>
          <div class="cols">
            <dl class="notes">
              <dt>${u("where")}</dt><dd>${tx(x.s.city)} · ${tx(x.s.place)}</dd>
              <dt>${u("period")}</dt><dd>${tx(f.date)}</dd>
              ${f.place ? `<dt>${L() === "ko" ? "장소" : "Place"}</dt><dd>${tx(f.place)}</dd>` : ""}
              ${f.team ? `<dt>${u("ctx")}</dt><dd>${tx(f.team)}</dd>` : ""}
            </dl>
            <div>
              ${f.big ? `<p class="big">${tx(f.big)}</p><p class="bign">${tx(f.bigNote)}</p>` : ""}
              ${secs}
              ${f.tags ? `<ul class="ptags">${f.tags.map(g => `<li>${esc(g)}</li>`).join("")}</ul>` : ""}
              ${f.links ? `<div class="plinks">${f.links.map(l => `<a href="${esc(l.href)}">${tx(l.label)}</a>`).join("")}</div>` : ""}
              ${f.private ? `<p class="priv">${tx(f.private)}</p>` : ""}
            </div>
          </div>
          <div class="dbar">
            <button type="button" data-doc="${prev ? prev.f.id : ""}" ${prev ? "" : "disabled"}>${u("prevf")}</button>
            <span>${k + 1} / ${FILES.length}</span>
            <button type="button" data-doc="${next ? next.f.id : ""}" ${next ? "" : "disabled"}>${u("nextf")}</button>
          </div>
        </article>
        <div class="spine" aria-hidden="true"><span>${tx(f.title)}</span></div>
        <button class="close" type="button" id="doc-close">${u("close")}</button>
      </div>`;
      doc.hidden = false;
      doc.scrollTop = 0;
      if (x.si !== cur) go(x.si, true);
      history.replaceState(null, "", "#" + id);
      document.getElementById("doc-close").focus();
    }
    function closeDoc() {
      doc.hidden = true; openId = null;
      history.replaceState(null, "", "#" + (cur < R.length ? R[cur].id : "contact"));
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    doc.addEventListener("click", e => {
      if (e.target === doc || e.target.id === "doc-close") return closeDoc();
      const d = e.target.closest("[data-doc]");
      if (d && d.dataset.doc) openDoc(d.dataset.doc);
    });

    document.addEventListener("keydown", e => {
      if (!doc.hidden) {
        if (e.key === "Escape") closeDoc();
        else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
          const k = FILES.indexOf(byId(openId)) + (e.key === "ArrowRight" ? 1 : -1);
          if (FILES[k]) openDoc(FILES[k].f.id);
        }
        return;
      }
      if (e.target.closest("input,textarea")) return;
      if (e.key === "ArrowRight") { e.preventDefault(); go(tgt + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); go(tgt - 1); }
    });

    document.getElementById("lang-toggle").addEventListener("click", () => {
      root.lang = L() === "ko" ? "en" : "ko";
      try { localStorage.setItem("lang", root.lang); } catch (e) {}
      const keep = cur, od = openId;
      render();
      track.scrollLeft = keep * track.clientWidth;
      if (od) openDoc(od);
    });

    const ro = new ResizeObserver(() => { drawRoute(); track.scrollLeft = cur * track.clientWidth; });
    ro.observe(track);

    render();
    const h = decodeURIComponent(location.hash.slice(1));
    const si = R.findIndex(s => s.id === h);
    if (si >= 0) go(si, true);
    else if (h === "contact") go(N - 1, true);
    else if (byId(h)) openDoc(h);
  }
  </script>
</body>
</html>
